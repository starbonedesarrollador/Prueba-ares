  var fine=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches;if(!fine)return;
  var cur=null,tm=null,lastHide=0;
  var place=function(el){var tip=$('rpxTip');if(!tip)return;var r=el.getBoundingClientRect();var w=tip.offsetWidth,h=tip.offsetHeight;var x=Math.min(window.innerWidth-w-12,Math.max(12,r.right-w-16));var y=r.bottom+6;if(y+h>window.innerHeight-8)y=Math.max(8,r.top-h-6);tip.style.left=x+'px';tip.style.top=y+'px'};
  document.addEventListener('mouseover',function(e){var el=e.target.closest&&e.target.closest('[data-tipk]');if(el===cur)return;var tip=$('rpxTip');if(!tip)return;
    if(!el){return}cur=el;clearTimeout(tm);var html=rpxTipHtml(el.dataset.tipk);if(!html)return;
    var show=function(){if(cur!==el)return;tip.innerHTML=html;tip.hidden=false;tip.classList.remove('on');place(el);requestAnimationFrame(function(){tip.classList.add('on')})};
    if(Date.now()-lastHide<300||!tip.hidden){tip.innerHTML=html;tip.hidden=false;tip.classList.add('on');place(el)}else tm=setTimeout(show,120)});
  document.addEventListener('mouseout',function(e){var el=cur;if(!el||el.contains(e.relatedTarget))return;cur=null;clearTimeout(tm);var tip=$('rpxTip');if(tip&&!tip.hidden){tip.classList.remove('on');lastHide=Date.now();setTimeout(function(){if(!cur)tip.hidden=true},100)}});
  window.addEventListener('scroll',function(){var tip=$('rpxTip');if(tip&&!tip.hidden&&cur)place(cur)},{passive:true});
}

  copyText('*TORNILLERÍA ORIENTE · Reporte*\n'+fDate(D.t0)+' al '+fDate(D.t1-864e5)+'\n\nVentas: '+usd(T.usd,2)+'\nGanancia bruta: '+usd(T.gan,2)+'\nGastos: '+usd(g,2)+'\nQueda: '+usd(T.gan-g,2)+'\nPiezas vendidas: '+nf(T.cant,0)+'\nPromedio por día: '+usd(T.nd?T.usd/T.nd:0,2)+'\n\n*Lo más vendido*\n'+top.map(function(x,i){var p=S.byCode[x.k];return (i+1)+'. '+(p?p.desc:x.desc)+' · '+usd(x.usd,2)}).join('\n'))}

function vendidoDesde(pid,dias,alm){var t0=Date.now()-dias*864e5,q=0,Pr=almPrin(),p=S.byId[pid];
  ventasArr().forEach(function(v){if(v.anulada||v.t<t0)return;(v.items||[]).forEach(function(it){if(it.id===pid&&(it.alm||Pr)===alm)q+=+it.cant||0})});
  if(alm===Pr&&p)S.H.forEach(function(x){if(x.t>=t0&&x.code===p.codigo)q+=+x.cant||0});return q}
function sugerenciasRelleno(de,dias){var Pr=almPrin(),I=almIdx()[de]||{},L=[];
  Object.keys(I).forEach(function(pid){var disp=I[pid];if(!(disp>0))return;var p=S.byId[pid];if(!p)return;var c=calc(p);var enT=stockAlm(p,Pr);var vend=vendidoDesde(pid,dias,Pr);
    var q=Math.max(vend,c.min-enT);q=Math.min(Math.round(q),disp);if(q>0)L.push({p:p,disp:disp,enT:enT,vend:vend,q:q})});
  return L.sort(function(a,b){return (a.enT-calc(a.p).min)-(b.enT-calc(b.p).min)||b.vend-a.vend})}

  var id=newId('tp');return tomarNumero('traspaso').then(function(nro){tp.nro=nro;tp.n=fmtCorr('traspaso',nro);return S.db.doc('traspasos/'+id).set(tp)}).then(function(){S.traspasos[id]=Object.assign({id:id},tp);_almC=null;return id})}

function mapeoColumnas(rows){
  var hdr=-1,guess={};
  for(var i=0;i<Math.min(rows.length,20);i++){var r=rows[i].map(function(x){return norm(x)});var g={};
    r.forEach(function(c,j){if(g.cod==null&&/^(cod|codigo|ref|referencia|item|articulo)/.test(c))g.cod=j;else if(g.desc==null&&/(descrip|producto|detalle|nombre)/.test(c))g.desc=j;else if(g.cant==null&&/^(cant|unid|qty|und)/.test(c))g.cant=j;else if(g.precio==null&&/(p\/?\s*unit|unitario|precio|costo)/.test(c))g.precio=j});
    if(g.cod!=null&&(g.cant!=null||g.precio!=null)){hdr=i;guess=g;break}}
  var ncol=Math.max.apply(null,rows.slice(0,50).map(function(r){return r.length}));var head=hdr>=0?rows[hdr]:[];
  var opt=function(sel){var o='<option value="-1">— No tiene —</option>';for(var j=0;j<ncol;j++)o+='<option value="'+j+'"'+(sel===j?' selected':'')+'>Columna '+String.fromCharCode(65+j)+(head[j]?' · '+esc(String(head[j]).slice(0,24)):'')+'</option>';return o};
  S.en={rows:rows,hdr:hdr};
  enStep('<p class="sec" style="margin-top:6px">Columnas del archivo</p><p class="muted" style="margin:0;font-size:13px">'+(hdr>=0?'Detecté los encabezados en la fila '+(hdr+1)+'. Revisa que cada columna sea la correcta.':'No encontré encabezados: indica qué columna es cada dato.')+'</p>'+
    '<div class="grid2"><div class="field"><label for="mCod">Código</label><select id="mCod" class="inp">'+opt(guess.cod)+'</select></div><div class="field"><label for="mDesc">Descripción</label><select id="mDesc" class="inp">'+opt(guess.desc)+'</select></div>'+
    '<div class="field"><label for="mCant">Cantidad</label><select id="mCant" class="inp">'+opt(guess.cant)+'</select></div><div class="field"><label for="mPre">Costo unitario $ (de lista)</label><select id="mPre" class="inp">'+opt(guess.precio)+'</select></div></div>'+
    '<div class="row" style="justify-content:flex-end"><button type="button" class="btn go" data-act="en-map">Continuar</button></div>');
}
