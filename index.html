<!doctype html><html><head>
<!-- DEMO — DATOS DE PRUEBA: entorno local que reemplaza la base de datos de Claude. Quitar esta línea para usar el sistema dentro de Claude. -->
<script src="demo/runtime.js"></script>
<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tornillería Oriente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: banda grafito con la marca (logo + tasa BCV) · pestañas de módulos en escritorio, barra inferior en teléfono · tarjetas sobre fondo gris claro */
:root{
  --bg:#F2F3F1; --surface:#FFFFFF; --sunken:#E8EAE7; --line:#DCDFDB; --line-strong:#BEC3BD;
  --fg:#262826; --muted:#5C615B; --brand:#353535; --brand-2:#2B2B2B; --brand-fg:#F4F5F3; --brand-muted:#AEB2AD;
  --lime:#5CCF00; --lime-ink:#1E2A12; --lime-text:#3B8500; --lime-soft:#E9F8DA;
  --ok:#2F7D00; --ok-soft:#E4F4D6; --warn:#8A5300; --warn-soft:#FCEFD6; --bad:#B42318; --bad-soft:#FBE4E1;
  --info:#1F5D99; --info-soft:#E3EDF8; --scrim:rgba(30,32,30,.55);
  --display:'Exo 2','Barlow',system-ui,sans-serif; --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1B1A; --surface:#232523; --sunken:#2B2E2B; --line:#363936; --line-strong:#4A4E4A;
  --fg:#ECEEEB; --muted:#A3A8A2; --brand:#141514; --brand-2:#0F100F; --brand-fg:#ECEEEB; --brand-muted:#9DA29C;
  --lime:#66DB0A; --lime-ink:#142008; --lime-text:#8AE53D; --lime-soft:#253A14;
  --ok:#8AE53D; --ok-soft:#21331A; --warn:#F2B866; --warn-soft:#3A2C12; --bad:#F59A92; --bad-soft:#3E201D;
  --info:#8EBEF0; --info-soft:#18293D; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1B1A; --surface:#232523; --sunken:#2B2E2B; --line:#363936; --line-strong:#4A4E4A;
  --fg:#ECEEEB; --muted:#A3A8A2; --brand:#141514; --brand-2:#0F100F; --brand-fg:#ECEEEB; --brand-muted:#9DA29C;
  --lime:#66DB0A; --lime-ink:#142008; --lime-text:#8AE53D; --lime-soft:#253A14;
  --ok:#8AE53D; --ok-soft:#21331A; --warn:#F2B866; --warn-soft:#3A2C12; --bad:#F59A92; --bad-soft:#3E201D;
  --info:#8EBEF0; --info-soft:#18293D; --scrim:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--lime-text);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.gutter{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}

/* cabecera */
.top{background:var(--brand);color:var(--brand-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{display:flex;align-items:center;gap:12px 18px;padding-block:10px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;text-decoration:none;color:inherit;min-width:0}
.brand img{width:46px;height:auto;flex-shrink:0}
.brand .wm{font-family:var(--display);font-weight:800;line-height:.95;letter-spacing:.04em;text-transform:uppercase}
.brand .wm b{display:block;font-size:17px}
.brand .wm span{display:block;font-size:17px;color:var(--lime)}
.status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--brand-muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--brand-muted)}
.status[data-s="live"] i{background:var(--lime)}
.status[data-s="off"] i{background:#E5484D}
.rate{font:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;color:inherit;text-decoration:none;white-space:nowrap}
.rate small{font-size:12px;color:var(--brand-muted);font-weight:600}
.rate b{font-size:15px}
.rate .old{font-size:11px;font-weight:700;background:#E5A000;color:#1F1600;border-radius:999px;padding:1px 7px}
.rate .ok{font-size:11px;font-weight:700;background:var(--lime);color:var(--lime-ink);border-radius:999px;padding:1px 7px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--brand-muted);white-space:nowrap}
.me .av{width:32px;height:32px;border-radius:50%;background:var(--lime);color:var(--lime-ink);font-weight:700;display:grid;place-items:center;font-size:13px}
.me b{color:var(--brand-fg);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1500px;margin:0 auto;scrollbar-width:none}
.tabs a{flex-shrink:0;display:flex;align-items:center;gap:7px;height:44px;padding:0 14px;color:var(--brand-muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--brand-fg)}
.tabs a[aria-current="page"]{color:var(--brand-fg);border-bottom-color:var(--lime)}
.badge{background:var(--lime);color:var(--lime-ink);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.bnav{display:none}
@media (max-width:760px){
  .tabs,.status,.me .nm{display:none}
  .brand .wm b,.brand .wm span{font-size:14px}.brand img{width:38px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:70px;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:none}
  .bnav .bi{display:grid;place-items:center;width:58px;height:34px;border-radius:999px}
  .bnav [aria-current="page"]{color:var(--fg)}
  .bnav [aria-current="page"] .bi{background:var(--lime-soft);color:var(--lime-text)}
  .bnav .fab .bi{width:58px;height:58px;margin-top:-26px;border-radius:50%;background:var(--lime);color:var(--lime-ink);box-shadow:0 6px 16px rgba(0,0,0,.22);border:4px solid var(--surface)}
  .bnav .fab[aria-current="page"] .bi{background:var(--lime);color:var(--lime-ink)}
  .sheet button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--sunken);color:var(--fg);border:0;font-weight:600;font-size:15px}
  .wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))!important}
}

.wrap{max-width:1500px;margin:0 auto;padding-block:22px 56px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head .eyebrow{font-size:14px;color:var(--muted);margin:0 0 2px}
.head h1{margin:0;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.01em;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted)}
.banner{border-radius:10px;padding:12px 16px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner a{color:inherit;font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:17px}
.sec{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lime-text);margin:0}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover:not(:disabled){background:var(--sunken)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.dark:hover:not(:disabled){background:var(--brand-2)}
.btn.go{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.go:hover:not(:disabled){filter:brightness(1.06);background:var(--lime)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.lg{height:52px;font-size:17px;padding:0 22px}
.icon-btn{width:40px;height:40px;border-radius:8px;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunken);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.inp{height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);width:100%;min-width:0}
textarea.inp{height:auto;padding:10px 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.plain{background:var(--sunken);color:var(--muted)}
.tag.ub{background:var(--lime-soft);color:var(--lime-text);gap:4px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}
.r{text-align:right}
.cat-row td{background:var(--sunken);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--lime-text)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px}
.kpi{padding:16px 18px}
.kpi small{display:block;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:26px;margin-top:6px;font-weight:600}
.kpi span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.kpi.hero small,.kpi.hero span{color:var(--brand-muted)}
.kpi.hero b{color:var(--lime)}

/* inicio */
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.home{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.pend{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border-left:4px solid}
.pend.bad{background:var(--bad-soft);border-color:var(--bad)}
.pend.warn{background:var(--warn-soft);border-color:var(--warn)}
.pend.info{background:var(--info-soft);border-color:var(--info)}
.pend div{flex:1;min-width:0}
.pend b{display:block}
.pend span{font-size:13px;color:var(--muted)}
.vrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%;text-align:left}
.vrow:hover{background:var(--sunken)}
.vrow span{font-size:13px;color:var(--muted)}
.qa{display:flex;flex-wrap:wrap;gap:8px}
.toplist{display:flex;flex-direction:column;gap:8px}
.toplist .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.toplist .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.toplist .bar i{display:block;height:100%;background:var(--lime);border-radius:3px}

/* buscador */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.pcard{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pcard .t{font-weight:700;overflow-wrap:anywhere}
.pcard .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.pcard .price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pcard .price b{font-size:24px}
.pcard .price span{color:var(--muted)}
.search-big{position:relative}
.search-big svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-big input{height:54px;font-size:17px;padding-left:44px;border-radius:12px}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.pos{grid-template-columns:minmax(0,1fr)}}
.results{display:flex;flex-direction:column;max-height:62vh;overflow-y:auto;margin:0 -6px}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res .d b{display:block;font-weight:600;overflow-wrap:anywhere}
.res .d span{font-size:13px;color:var(--muted)}
.res .p{text-align:right}
.res .p small{display:block;font-size:12px;color:var(--muted)}
.cart-line{display:grid;grid-template-columns:minmax(0,1fr) 92px auto 40px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cart-line:first-child{border-top:0}
.cart-line .inp{height:40px;text-align:right;padding:0 8px}
.cart-line .d b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.cart-line .d span{font-size:12px;color:var(--muted)}
.cart-line .t{text-align:right}
.cart-line .t small{display:block;font-size:12px;color:var(--muted)}
.totals{background:var(--brand);color:var(--brand-fg);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.totals small{color:var(--brand-muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-weight:700}
.totals .big{font-size:26px;font-weight:600}
.totals .big.l{color:var(--lime)}
.pay-add{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:560px){.pay-add{grid-template-columns:1fr 1fr}.pay-add .btn{grid-column:1/-1}}
.pay-line{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.pay-line .m{flex:1;min-width:0}
.pay-line .m span{display:block;font-size:12px;color:var(--muted)}
.balance{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;font-weight:600;flex-wrap:wrap}
.balance.due{background:var(--warn-soft);color:var(--warn)}
.balance.paid{background:var(--ok-soft);color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{height:36px;padding:0 14px;border:0;background:var(--surface);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg)}
.cli-ok{font-size:13px;color:var(--ok);font-weight:600}

dialog{border:0;padding:0;background:var(--surface);color:var(--fg);border-radius:16px;width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:var(--scrim)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-h h2{margin:0;font-size:18px}
.dlg-b{padding:18px;display:flex;flex-direction:column;gap:16px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:8px}
.calc div{background:var(--sunken);border-radius:8px;padding:10px 12px}
.calc small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.calc b{font-size:16px}
.calc .hl{background:var(--lime-soft)}
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:18px}
.sheet svg{flex-shrink:0}
.sheet a,.sheet button{font:inherit;border:0;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;padding:16px 14px;font-size:15px;border-radius:12px;background:var(--sunken);color:var(--fg);text-decoration:none;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--brand-fg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:100;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (min-width:761px){.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.toast.bad{background:var(--bad);color:#fff}
.rate-card .v{font-size:44px;font-weight:600;line-height:1}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}
.ct-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left}
.ct-card.off{opacity:.65}
.ct-h{display:flex;align-items:center;gap:12px}
.ct-h b{display:block;font-size:16px;overflow-wrap:anywhere}
.ct-h span:not(.ct-ic):not(.tag){display:block;font-size:13px;color:var(--muted)}
.ct-ic{width:42px;height:42px;border-radius:11px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;flex-shrink:0}
.ct-datos{background:var(--sunken);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:14px;overflow-wrap:anywhere}
.ct-mes{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px}
.ct-new{border-style:dashed;cursor:pointer;align-items:flex-start}
.ct-new:hover{background:var(--sunken)}
.linkbtn{background:none;border:0;padding:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.diff-ok{color:var(--ok);font-weight:600}.diff-bad{color:var(--bad);font-weight:600}



/* ===== pulido general: más amigable ===== */
body{font-size:15.5px}
.panel{border-radius:16px;border-color:color-mix(in srgb,var(--line) 75%,transparent);box-shadow:0 1px 2px rgba(20,24,20,.04),0 2px 8px rgba(20,24,20,.03)}
.sec{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.005em;text-transform:none;color:var(--fg)}
.kpi small,.rp-k small{font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.kpi b{font-size:27px}
th{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted);background:color-mix(in srgb,var(--sunken) 45%,var(--surface))}
td{padding:10px}
.head h1{font-size:30px}
.btn{border-radius:11px}
.chip{border-color:var(--line);background:var(--surface)}
.chip:hover{border-color:var(--line-strong)}
.inp{border-radius:10px}
.inp:focus{outline:none;border-color:var(--lime-text);box-shadow:0 0 0 3px var(--lime-soft)}
.empty{padding:36px 16px;font-size:15px}
.banner{border-radius:12px;padding:12px 16px 12px 44px;position:relative}
.banner::before{content:"!";position:absolute;left:14px;top:12px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:currentColor;color:var(--surface)}
.banner.info::before{content:"i"}
.banner::before{color:#fff!important}.banner.info::before{background:var(--info)}.banner.warn::before{background:var(--warn)}.banner.bad::before{background:var(--bad)}

.vrow>div:first-child{min-width:0}.vrow>div>b{display:block}
.mlab{display:none}
.pdesc{min-width:240px}
@media (max-width:640px){
  #invTable .inv-s thead{display:none}
  #invTable .inv-s tr.click{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"d p" "u e" "x c";gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  #invTable .inv-s tr.click td{padding:0;border:0;min-width:0}
  #invTable .inv-s .c-d{grid-area:d}#invTable .inv-s .c-p{grid-area:p}#invTable .inv-s .c-u{grid-area:u}#invTable .inv-s .c-e{grid-area:e}
  #invTable .inv-s .c-x{grid-area:x;text-align:left}#invTable .inv-s .c-c{grid-area:c}
  #invTable .inv-s .c-e .muted{display:inline;margin-left:6px}
  #invTable .inv-s tr.cat-row{display:block}#invTable .inv-s tr.cat-row td{display:block}
  .mlab{display:inline;color:var(--muted);font-size:12.5px;font-family:var(--sans)}
  .head .row .btn{height:38px;font-size:14px;padding:0 12px}
}
.seg button{height:auto;min-height:36px;padding:6px 14px;line-height:1.2}
@media (max-width:640px){.seg{display:flex;width:100%}.seg button{flex:1;padding:6px 8px;font-size:13.5px}}
.calc small{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600}
.ct-card>.row:last-child{margin-top:auto}
.totals small{text-transform:none!important;letter-spacing:0!important}
.dsc{display:flex;gap:8px;flex-wrap:wrap}.dsc span{flex:1 1 120px;background:var(--sunken);border-radius:10px;padding:8px 12px}.dsc small{display:block;font-size:12.5px;color:var(--muted)}.dsc b{font-size:18px}
/* caja */
.wrap a:not(.btn):not(.chip):not(.panel):not(.wa):not(.s-it):not(.vrow){color:var(--lime-text);font-weight:600;text-decoration:none}
.wrap a:not(.btn):not(.chip):not(.panel):not(.wa):not(.s-it):not(.vrow):hover{text-decoration:underline}
#body,#clBody{display:flex;flex-direction:column;gap:16px}
#body>.chips,#body>.row{margin:0}
.av-s{width:34px;height:34px;border-radius:50%;background:var(--lime-soft);color:var(--lime-text);display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block}.who small{display:block;color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.wa{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:#E7F8EC;color:#127A3A;font-weight:600;font-size:13px;text-decoration:none}
.wa:hover{background:#D3F2DC}
.stk{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;font-weight:600}
.stk i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stk.lo i{background:var(--warn)}.stk.out i{background:var(--bad)}.stk.out{color:var(--bad)}
.pdesc b{display:block;font-weight:600}.pdesc small{font-family:var(--mono);color:var(--muted);font-size:12px}
.price2 b{display:block}.price2 small{display:block;color:var(--muted);font-size:12.5px}
.vtog{margin-left:auto;display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px}
.vtog button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:8px}
.vtog button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pay-add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
.pay-add>.field:first-child{grid-column:1/-1}
.pay-add>.btn{grid-column:1/-1}
.vstack{display:flex;flex-direction:column;gap:16px}
#homeBody .kpis{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.cj-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cj-nav .inp{width:auto;height:36px}
.cj-day{font-family:var(--display);font-size:18px;margin-left:8px}
.guide>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px}
.guide>summary::-webkit-details-marker{display:none}
.g-ic{width:26px;height:26px;border-radius:50%;background:var(--info-soft);color:var(--info);display:grid;place-items:center;font-weight:800}
.g-steps{margin:0;padding:0 18px 4px 18px;list-style:none;counter-reset:g;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}
.g-steps li{counter-increment:g;background:var(--sunken);border-radius:12px;padding:12px 14px 12px 48px;position:relative;font-size:14.5px;line-height:1.45}
.g-steps li::before{content:counter(g);position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--lime);color:var(--lime-ink);font-weight:800;display:grid;place-items:center;font-size:13px}
.g-steps b{display:block;margin-bottom:2px}
.g-note{margin:12px 18px 16px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stp{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stp .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--sunken);color:var(--muted);flex-shrink:0}
.stp b{display:block;font-size:15px}.stp small{color:var(--muted);font-size:13px}
.stp.done .n{background:var(--ok-soft);color:var(--ok)}
.stp.now{border-color:var(--lime);box-shadow:0 0 0 3px var(--lime-soft)}
.stp.now .n{background:var(--lime);color:var(--lime-ink)}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.cj-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.cj-grid .col{display:flex;flex-direction:column;gap:16px}
@media (max-width:1000px){.cj-grid{grid-template-columns:1fr}}
.cj-card.focus{border-color:var(--lime)}
.cj-h{display:flex;gap:12px;align-items:flex-start}
.cj-h h2{margin:0;font-family:var(--display);font-size:19px}.cj-h p{margin:2px 0 0;font-size:14px}
.cj-n{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--lime);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.cj-ap{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:start}
.cj-ap .btn{margin-top:23px}
@media (max-width:560px){.cj-ap{grid-template-columns:1fr}.cj-ap .btn{margin-top:0}}
.cj-ok{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:14.5px}
.cj-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:8px}
.cj-t{background:var(--sunken);border-radius:12px;padding:10px 12px}
.cj-t small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cj-t b{font-size:18px}
.cj-sum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.cj-sum a{margin-left:auto}
.cj-rows{display:flex;flex-direction:column}
.cj-row{display:grid;grid-template-columns:minmax(0,1fr) 160px 130px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cj-row:last-child{border-bottom:0}
.cj-row .lb b{display:block;font-size:15px}.cj-row .lb small{color:var(--muted);font-size:13px}
.cj-row .cnt{text-align:right}.cj-row .inp{text-align:right}
.cj-row .df{text-align:right}
@media (max-width:560px){.cj-row{grid-template-columns:1fr 1fr}.cj-row .lb{grid-column:1/-1}}
.cj-res{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;font-size:14px}
.cj-res b{font-size:16px}
.cj-res.ok{background:var(--ok-soft);color:var(--ok)}.cj-res.bad{background:var(--bad-soft);color:var(--bad)}
.ins .ic svg{width:15px;height:15px}
.ins .ic{width:30px;height:30px;border-radius:9px}

/* reportes */
.rp{display:flex;flex-direction:column;gap:16px}
.rp-bar{padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.rp-seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunken);border-radius:12px;padding:4px}
.rp-seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:9px;cursor:pointer}
.rp-seg button:hover{color:var(--fg)}
.rp-seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rp-when{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.rp-when .inp{height:38px;width:auto}
.rp-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.rp-tabs button{font:inherit;font-weight:600;font-size:15px;border:0;background:none;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.rp-tabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--lime)}
.rp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.rp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rp-k{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rp-k small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rp-k>b{font-size:clamp(22px,2.4vw,30px);line-height:1.15;overflow-wrap:anywhere}
.rp-k .sub{font-size:13px;color:var(--muted)}
.rp-k.hero{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.rp-k.hero small,.rp-k.hero .sub{color:var(--brand-muted)}.rp-k.hero>b{color:var(--lime)}
.dl{font-size:13px;font-weight:700}.dl small{font-weight:500;opacity:.75}
.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}.dl.n{color:var(--muted);font-weight:500}
.rp-k.hero .dl.up{color:var(--lime)}.rp-k.hero .dl.dn{color:#FF8A8A}
.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}
.rp-mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rp-mini>div{padding:12px 16px;border-left:1px solid var(--line)}.rp-mini>div:first-child{border-left:0}
.rp-mini small{display:block;font-size:12.5px;color:var(--muted)}.rp-mini b{font-size:18px}
@media (max-width:640px){.rp-mini{grid-template-columns:1fr 1fr}.rp-mini>div:nth-child(3){border-left:0}.rp-mini>div:nth-child(n+3){border-top:1px solid var(--line)}}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ins li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--sunken)}
.ins li p{margin:0;font-size:14.5px;line-height:1.5}
.ins .ic{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--line-strong);color:var(--fg)}
.ins li.ok .ic{background:var(--lime);color:var(--lime-ink)}
.ins li.warn{background:var(--warn-soft)}.ins li.warn .ic{background:var(--warn);color:#fff}
.ins li.bad{background:var(--bad-soft,#FDECEC)}.ins li.bad .ic{background:var(--bad);color:#fff}
.rp-chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;margin-top:8px}
.rp-y{display:flex;flex-direction:column;justify-content:space-between;height:180px;font-size:11px;color:var(--muted);text-align:right}
.rp-plot{position:relative;min-width:0}
.rp-grid{position:absolute;inset:0 0 auto;height:180px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.rp-grid i{display:block;border-top:1px dashed var(--line)}
.rp-avg{position:absolute;left:0;right:0;border-top:2px dashed var(--warn);pointer-events:none;z-index:1}
.rp-avg span{position:absolute;right:0;top:-20px;font-size:11px;font-weight:700;color:var(--warn);background:var(--surface);padding:0 4px;border-radius:4px}
.rp-bars{position:relative;display:flex;align-items:flex-end;gap:3px;height:180px}
.rp-b{flex:1 1 0;min-width:0;background:var(--lime);border-radius:3px 3px 0 0;opacity:.85}
.rp-b:hover{opacity:1;filter:brightness(.9)}
.rp-b.best{background:var(--lime-text,#3B8500);opacity:1}
.rp-x{display:flex;gap:3px;font-size:11px;color:var(--muted);margin-top:6px}.rp-x span{flex:1 1 0;min-width:0;white-space:nowrap;overflow:visible}
.rp-2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.rp-2{grid-template-columns:1fr}}
.rk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rk li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center}
.rk .n{width:28px;height:28px;border-radius:8px;background:var(--sunken);display:grid;place-items:center;font-weight:800;font-size:13px}
.rk li:first-child .n{background:var(--lime);color:var(--lime-ink)}
.rk .d b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}.rk .d span{font-size:12.5px;color:var(--muted)}
.rk .bar{height:5px;border-radius:3px;background:var(--sunken);margin-top:5px;overflow:hidden}.rk .bar i{display:block;height:100%;background:var(--lime)}
.rk .v{font-size:15px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:190px}
.wk>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.wk i{display:block;width:100%;max-width:44px;background:var(--line-strong);border-radius:6px 6px 0 0}
.wk .best i{background:var(--lime)}
.wk span{font-size:11px;color:var(--muted);white-space:nowrap}.wk .best span{color:var(--fg);font-weight:700}
.wk small{font-size:12px;font-weight:600;text-transform:capitalize}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunken);margin:6px 0 12px}
.stack i{display:block;height:100%;background:var(--lime-text,#3B8500);border-right:2px solid var(--surface)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:8px 20px}
.cats>div{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.cats>div>i{width:12px;height:12px;border-radius:3px;background:var(--lime-text,#3B8500)}
.cats span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cats small{color:var(--muted);width:38px;text-align:right}

.rp .rp-k small{font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:0;text-transform:none}
.cats span{text-transform:lowercase}.cats span::first-letter{text-transform:uppercase}

/* ===== v28 · móvil más fácil, buscador y pulido de interacción ===== */
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}
::selection{background:var(--lime-soft);color:var(--fg)}
input,textarea{caret-color:var(--lime-text)}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.btn,.chip,.fnd-tile,.quick a,.home-find,.s-it,.s-cta,.bnav a,.bnav button,.vrow,.hsearch{transition:transform 140ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,color 160ms ease}
.btn:active:not(:disabled),.chip:active,.fnd-tile:active,.quick a:active,.home-find:active,.s-cta:active,.bnav a:active .bi,.bnav button:active .bi,.vrow:active,.hsearch:active{transform:scale(0.97)}
@media (hover:none){.btn:hover:not(:disabled){background:var(--surface)}.btn.go:hover:not(:disabled){filter:none}.btn.dark:hover:not(:disabled){background:var(--brand)}tr.click:hover td{background:transparent}}
dialog[open]{animation:dlgIn 200ms var(--ease-out)}
dialog[open]::backdrop{animation:fadeIn 200ms ease}
@keyframes dlgIn{from{opacity:0;transform:translateY(8px) scale(0.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
dialog.is-finder[open],dialog.is-finder[open]::backdrop{animation:none}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:fadeIn 120ms ease}.btn:active:not(:disabled),.chip:active,.quick a:active{transform:none}}
/* botón buscar de la barra superior */
.hsearch{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:var(--brand-fg);font:inherit;font-size:14px;cursor:pointer;min-width:0}
.hsearch:hover{background:rgba(255,255,255,.12)}
.hs-l{color:var(--brand-muted);white-space:nowrap}
.hs-k{font-family:var(--mono);font-size:11px;color:var(--brand-muted);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:1px 6px}
@media (min-width:761px){.top-in{justify-content:flex-start}.hsearch{width:min(420px,40vw);margin-right:auto}.hs-k{margin-left:auto}}
/* buscador */
dialog.is-finder{width:min(720px,calc(100% - 24px));max-height:min(78vh,760px);margin-top:10vh;padding:0}
.fnd{display:flex;flex-direction:column;max-height:inherit}
.fnd-h{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.fnd-h input{flex:1;min-width:0;height:44px;border:0;background:transparent;font:inherit;font-size:17px;color:var(--fg);outline:none}
.fnd-b{overflow-y:auto;padding:8px 12px 16px;overscroll-behavior:contain}
.fnd-t{margin:12px 6px 6px;font-size:13px;font-weight:600;color:var(--muted)}.fnd-t span{font-weight:500}
.fnd-hint{margin:14px 6px 4px;font-size:14px;color:var(--muted);line-height:1.5}
.fnd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fnd-tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--sunken);font:inherit;font-weight:600;font-size:15px;color:var(--fg);cursor:pointer;text-align:left}
.fnd-tile svg{color:var(--lime-text)}
.fnd-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fnd-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.fnd-row:first-child{border-top:0}
.fnd-row.sec{width:100%;border-left:0;border-right:0;border-bottom:0;font:inherit;color:var(--fg);cursor:pointer;text-align:left}
.fnd-row.sec svg{color:var(--lime-text);flex-shrink:0}
.fnd-main{flex:1;min-width:0;background:none;border:0;padding:0;font:inherit;color:var(--fg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}

.ini{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.ini-a,.ini-b{display:flex;flex-direction:column;gap:16px;min-width:0}
.ini-pend .pl{display:flex;flex-direction:column;gap:8px}
.cnt{min-width:24px;height:24px;padding:0 8px;border-radius:999px;background:var(--sunken);font-size:13px;font-weight:700;display:inline-grid;place-items:center}
.ok-line{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:14.5px}
/* dinero */
.ml-list{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--line);color:inherit;text-decoration:none;border-radius:8px;transition:background-color 140ms ease}
.mrow:first-child{border-top:0}
.ml{display:flex;flex-direction:column;font-size:15px;font-weight:600;min-width:0}
.ml small{font-size:13px;font-weight:400;color:var(--muted)}
.mrow b{font-size:19px;font-weight:700}.mrow b.neg{color:var(--bad)}
.mrow .go{color:var(--muted);transition:transform 160ms cubic-bezier(.22,1,.36,1)}
@media (hover:hover){.mrow:hover{background:var(--sunken)}.mrow:hover .go{transform:translateX(2px);color:var(--fg)}}
/* inventario */
.iv-big small{display:block;font-size:13px;color:var(--muted)}
.iv-big b{display:block;font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-0.015em;margin-top:2px}
.iv-bar{display:flex;gap:2px;height:10px;margin-top:2px}
.iv-bar i{display:block;height:100%}
.iv-bar .c{background:var(--brand);border-radius:4px 0 0 4px}
.iv-bar .g{flex:1;background:var(--lime);border-radius:0 4px 4px 0}
.iv-leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.iv-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.iv-leg i.c{background:var(--brand)}.iv-leg i.g{background:var(--lime)}
.iv-leg b{color:var(--fg);font-weight:600}
.iv-n{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.iv-n a{display:flex;flex-direction:column;padding:10px 12px;border-radius:10px;background:var(--sunken);color:inherit;text-decoration:none;transition:background-color 140ms ease}
.iv-n b{font-size:20px;font-weight:700}.iv-n span{font-size:13px;color:var(--muted)}
.iv-n a.bad b{color:var(--bad)}.iv-n a.warn b{color:var(--warn)}
@media (hover:hover){.iv-n a:hover{background:var(--line)}}
.iv-alm{margin:0;font-size:13px;color:var(--muted)}
.ini-inv,.ini-din,.ini-top,.ini-pend{gap:12px}
/* lo más vendido */
.top-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top-c{display:flex;gap:6px;flex-wrap:wrap}
.top-c .seg button{min-height:32px;padding:0 10px;font-size:13px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.rk{font-size:13px;font-weight:700;color:var(--muted)}
.rank li:first-child .rk{color:var(--lime-text)}
.rd{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank b{font-size:14.5px;font-weight:700}
.rb{grid-column:2/-1;height:5px;border-radius:3px;background:var(--sunken);overflow:hidden}
.rb i{display:block;height:100%;border-radius:3px;background:var(--lime)}
.sync-l{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 6px;font-size:13px;color:var(--muted)}
.sync-l .linkbtn{font-size:13px}
@media (max-width:1100px){.hoy{grid-template-columns:minmax(0,1fr);gap:20px}}
@media (max-width:1000px){.ini{grid-template-columns:minmax(0,1fr)}.ini-a,.ini-b{display:contents}
  .ini-pend{order:1}.ini-din{order:2}.ini-inv{order:3}.ini-top{order:4}.ini-a>section:last-child{order:5}.sync-l{order:6}}
@media (max-width:760px){.hoy{padding:18px}.hoy-s{grid-template-columns:repeat(2,minmax(0,1fr))}.hoy-s dd{font-size:17px}.ch-wrap svg{max-height:170px}}
@media (prefers-reduced-motion:reduce){.ch-wrap .bar.grow{animation:none}}
.ch-tip[hidden]{display:none}
.hoy .hoy-h{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(26px,2.6vw,36px);line-height:1.1;letter-spacing:-0.02em}
.hoy .hoy-h b{font-weight:800}
.hoy-s{grid-template-columns:repeat(4,minmax(0,1fr))}
#homeBody a.mrow,#homeBody a.mrow:hover{color:var(--fg);text-decoration:none}
#homeBody a.mrow b{color:var(--fg)}#homeBody a.mrow b.neg{color:var(--bad)}
#homeBody .iv-n a,#homeBody .iv-n a:hover{color:var(--fg);text-decoration:none}
#homeBody .iv-n a b{color:var(--fg)}#homeBody .iv-n a.bad b{color:var(--bad)}#homeBody .iv-n a.warn b{color:var(--warn)}
#homeBody .lnk,.lnkb{font:inherit;font-size:14px;font-weight:600;color:var(--lime-text);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
@media (hover:hover){#homeBody .lnk:hover,.lnkb:hover{text-decoration:underline;text-underline-offset:3px}}
@media (max-width:760px){.hoy-s{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nw{white-space:nowrap}
@media (max-width:760px){.ch-wrap .dl{font-size:19px}.ch-wrap .vl{font-size:20px}.top-c .seg{width:auto;display:inline-flex}.top-c .seg button{flex:0 0 auto}}
.hoy-t{container-type:inline-size}
.hoy .hoy-s{grid-template-columns:repeat(2,minmax(0,1fr))}
@container (min-width:500px){.hoy .hoy-s{grid-template-columns:repeat(4,minmax(0,1fr))}}
:root{--ivc:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ivc:#8B9189}}
:root[data-theme="dark"]{--ivc:#8B9189}
.iv-bar .c,.iv-leg i.c{background:var(--ivc)}
/* ===== v39 · el lenguaje del Inicio en todo el sistema ===== */
.sec{font-size:17px;letter-spacing:-0.005em}
.kpis:has(> .kpi.panel),.rp-kpis{gap:0;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,24,20,.04),0 2px 8px rgba(20,24,20,.03)}
.kpis:has(> .kpi.panel)>.kpi.panel,.rp-kpis>.rp-k.panel{border:0;border-radius:0;background:transparent;box-shadow:-1px 0 0 var(--line),0 -1px 0 var(--line);padding:18px 20px}
.kpis:has(> .kpi.panel)>.kpi:first-child>b,.rp-kpis>.rp-k:first-child>b{font-family:var(--display);font-size:32px;letter-spacing:-0.02em;line-height:1.1}
.kpis:has(> .kpi.panel)>a.kpi{transition:background-color 140ms ease}
@media (hover:hover){.kpis:has(> .kpi.panel)>a.kpi:hover{background:var(--sunken)}}
.rp-kpis>.rp-k.hero{background:transparent;color:var(--fg)}
.rp-kpis>.rp-k.hero small,.rp-kpis>.rp-k.hero .sub{color:var(--muted)}
.rp-kpis>.rp-k.hero>b{color:var(--fg)}
.rp-kpis>.rp-k.hero .dl.up{color:var(--ok)}.rp-kpis>.rp-k.hero .dl.dn{color:var(--bad)}
@media (max-width:760px){.kpis:has(> .kpi.panel)>.kpi.panel,.rp-kpis>.rp-k.panel{padding:14px 16px}.kpis:has(> .kpi.panel)>.kpi:first-child>b,.rp-kpis>.rp-k:first-child>b{font-size:26px}}
@media (max-width:760px){
  #app table.rp-t:not(.inv-s):not(.keep) thead{display:block;border-bottom:1px solid var(--line)}
  #app table.rp-t:not(.inv-s):not(.keep) thead tr{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
  #app table.rp-t:not(.inv-s):not(.keep) thead tr::-webkit-scrollbar{display:none}
  #app table.rp-t:not(.inv-s):not(.keep) thead th{display:block;padding:0;border:0;flex-shrink:0;background:none}
  #app table.rp-t:not(.inv-s):not(.keep) thead th:not([aria-sort]){display:none}
  #app table.rp-t:not(.inv-s):not(.keep) .th-s{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;width:auto}
  #app table.rp-t:not(.inv-s):not(.keep) .th-s.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
  #app table.rp-t:not(.inv-s):not(.keep) .th-s.on svg{color:var(--lime)}
}
/* ===== Inicio v36: módulos, fichas al pasar y personalizar ===== */
[data-view="inicio"] #homeBody{display:flex;flex-direction:column;gap:14px}
.ix-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:36px;margin-top:-6px}
.ix-help{margin:0 auto 0 0;font-size:14px;color:var(--muted)}
.ix-cust{color:var(--muted)}
.ix-tray{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ix-grid{display:flex;flex-direction:column;gap:16px}
.ix-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.ix-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.ix-mod{min-width:0;position:relative}
@media (max-width:1080px){.ix-pair{display:flex;flex-direction:column}.ix-col{display:contents}}
.ix-bar.ix-mob{display:none}
@media (max-width:760px){.ix-bar.ix-mob{display:flex}}
.ix-m{padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px}
.ix-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:32px}
.ix-sub{margin:-6px 0 0;font-size:13.5px;color:var(--muted)}
.ix-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.ix-big>b{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-0.015em}
.ix-big>span{font-size:13.5px;color:var(--muted)}
.ix-big .bad{color:var(--bad);font-weight:600}
.ix-list{display:flex;flex-direction:column;margin:0 -8px}
.ix-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:9px 8px;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;color:inherit;text-align:left;font:inherit;text-decoration:none}
.ix-list>.ix-row:first-child{border-top:0}
button.ix-row,.ix-tb{cursor:pointer}
.ix-at{grid-template-columns:10px minmax(0,1fr) auto}
.ix-cobr{grid-template-columns:minmax(0,1fr) auto 36px;gap:8px}
.ix-t{display:flex;flex-direction:column;min-width:0;gap:1px}
.ix-t b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix-t small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix-tb{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.ix-r{display:flex;flex-direction:column;align-items:flex-end}.ix-r small{font-size:12px;color:var(--muted)}
.ix-amt{font-size:14px}
.ix-ib{width:36px;height:36px}
.ix-tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.ix-tag.warn{background:var(--warn-soft);color:var(--warn)}.ix-tag.bad{background:var(--bad-soft);color:var(--bad)}
.ix-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;vertical-align:1px;margin-right:6px}
.ix-at .ix-dot{margin:0}
.ix-dot.ok{background:var(--ok)}.ix-dot.warn{background:var(--warn)}.ix-dot.bad{background:var(--bad)}.ix-dot.info{background:var(--info)}
.ix-f{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding-top:2px}
.ix-empty{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:10px;background:var(--sunken)}
.ix-empty b{font-weight:600}.ix-empty span{font-size:14px;color:var(--muted)}.ix-empty .btn{margin-top:4px}
.ix-go{color:var(--muted)}
/* tasa y caja */
.ix-estado{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.ix-cell{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"k b" "v b" "s s";align-items:center;gap:2px 12px;padding:16px 18px;border-left:1px solid var(--line)}
.ix-cell:first-child{border-left:0}
.ix-cell .ix-k{grid-area:k;font-size:13px;font-weight:600;color:var(--muted)}
.ix-cell .ix-v{grid-area:v;font-size:22px;font-weight:600}
.ix-cell .ix-vs{font-family:var(--sans);font-size:18px}
.ix-cell .ix-s{grid-area:s;font-size:13px;color:var(--muted);margin-top:2px}
.ix-cell .ix-s .up{color:var(--ok);font-weight:600}.ix-cell .ix-s .dn{color:var(--bad);font-weight:600}
.ix-cell>.btn{grid-area:b;align-self:start}
@media (max-width:760px){.ix-cell{border-left:0;border-top:1px solid var(--line)}.ix-cell:first-child{border-top:0}}
/* antigüedad de la cobranza */
.ix-age{display:flex;gap:3px;height:12px}
.ix-age>span{border-radius:4px;min-width:10px;position:relative}
.ix-age .a1{background:var(--ok)}.ix-age .a2{background:#A9C23A}.ix-age .a3{background:var(--warn)}.ix-age .a4{background:var(--bad)}
/* lo más vendido: filas con ficha */
.ini-top .rank li{position:relative;border-radius:8px;padding:2px 4px;margin:0 -4px}
/* fichas al pasar el mouse */
.ix-pk{position:relative}
.ix-peek{position:absolute;z-index:40;left:0;top:calc(100% + 6px);min-width:260px;max-width:min(360px,calc(100vw - 32px));padding:12px 14px;border-radius:12px;background:var(--brand);color:var(--brand-fg);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 34px rgba(18,20,16,.28);font-size:13.5px;font-weight:400;line-height:1.35;text-align:left;white-space:normal;
  opacity:0;visibility:hidden;transform:translateY(-4px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity 100ms cubic-bezier(.23,1,.32,1),transform 100ms cubic-bezier(.23,1,.32,1),visibility 0s linear 100ms}
.ix-peek.rt{left:auto;right:0;transform-origin:top right}
.ix-peek.mid{left:auto;right:8px;transform-origin:top right}
.ix-peek .ttl{font-size:12.5px;font-weight:700;color:var(--brand-fg);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix-pl{display:flex;justify-content:space-between;gap:16px;padding:2px 0;color:var(--brand-muted)}
.ix-pl span{min-width:0}
.ix-pl b{color:var(--brand-fg);font-weight:600;text-align:right}
.ix-pl b.num{white-space:normal;overflow-wrap:anywhere}.ix-pl b.pv{color:var(--lime)}.ix-pl b.bad{color:#FF8A80}
.ix-peek .pn{margin-top:6px;font-size:12.5px;color:var(--brand-muted)}
.ix-peek .sep{height:1px;background:rgba(255,255,255,.12);margin:6px 0}
.ix-pk:focus-visible>.ix-peek{opacity:1;visibility:visible;transform:none;transition:opacity 150ms cubic-bezier(.23,1,.32,1),transform 150ms cubic-bezier(.23,1,.32,1),visibility 0s}
@media (hover:hover) and (pointer:fine){
  .ix-pk:hover>.ix-peek{opacity:1;visibility:visible;transform:none;transition:opacity 150ms cubic-bezier(.23,1,.32,1) 120ms,transform 150ms cubic-bezier(.23,1,.32,1) 120ms,visibility 0s linear 120ms}
  body.ix-inst .ix-pk:hover>.ix-peek{transition:none}
  .ix-row:hover,.ini-top .rank li:hover{background:var(--sunken)}
  .ix-cust:hover{color:var(--fg)}
}
.hoy-s .ix-pk{cursor:default}
.ch-tip.ix-tip{gap:2px;max-width:280px;white-space:normal}
.ch-tip .ix-tv{font-size:14px}
.ch-tip .ix-tsep{border-top:1px solid rgba(255,255,255,.14);padding-top:4px;margin-top:2px}
.ch-tip b.num{color:var(--brand-fg)}
.ch-wrap .cb:focus{outline:none}.ch-wrap .cb:focus-visible .bar{stroke:var(--lime-text);stroke-width:2}
/* personalizar */
.ix-edit{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 6px;margin-bottom:6px;border-radius:10px;background:var(--sunken);font-size:14px}
.ix-edit b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix-edit .icon-btn{width:36px;height:36px}
.ix-handle{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:grab;touch-action:none}
.ix-handle:active{cursor:grabbing}
.ix-grid.editing .ix-mod>.panel{display:none}
.ix-grid.editing .ix-edit{margin:0;min-height:56px;background:var(--surface);border:1px solid var(--line);padding:8px 10px 8px 8px}
.ix-grid.editing .ix-pair,.ix-grid.editing{gap:10px}.ix-grid.editing .ix-col{gap:10px}
.ix-grid.editing .ix-peek{display:none}
.ix-mod.ix-dragging{z-index:50;cursor:grabbing}
.ix-mod.ix-dragging>.ix-edit{box-shadow:0 18px 40px rgba(0,0,0,.22);transform:scale(1.02)}
.ix-mod.ix-over>.ix-edit{outline:2px solid var(--lime-text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ix-peek,.ix-pk:hover>.ix-peek,.ix-pk:focus-visible>.ix-peek{transform:none!important}}
body.ix-nosel{user-select:none;-webkit-user-select:none}
@media (hover:none){.ix-peek{display:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ix-peek{background:#3A3D3A;border-color:rgba(255,255,255,.1)}}
:root[data-theme="dark"] .ix-peek{background:#3A3D3A;border-color:rgba(255,255,255,.1)}

/* ===== Reportes v36: secciones laterales, período compacto, fichas ===== */
.rpx{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;align-items:start}
.rpx-nav{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rpx-nav button{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:10px 10px;border:0;border-radius:10px;background:transparent;color:var(--fg);text-align:left;font:inherit;transition:background-color 150ms ease,transform 140ms cubic-bezier(.23,1,.32,1)}
.rpx-nav button:active{transform:scale(.98)}
.rpx-nav svg{color:var(--muted)}
.rpx-nav .t{display:flex;flex-direction:column;min-width:0}
.rpx-nav .t b{font-size:14.5px;font-weight:600}
.rpx-nav .t small{font-size:12px;color:var(--muted);line-height:1.25;margin-top:1px}
.rpx-nav button.on{background:var(--lime-soft)}
.rpx-nav button.on svg,.rpx-nav button.on .t b{color:var(--lime-text)}
.rpx-nav .cnt{font-size:12px;font-weight:700;background:var(--sunken);color:var(--muted);border-radius:999px;padding:1px 8px}
@media (hover:hover) and (pointer:fine){.rpx-nav button:not(.on):hover{background:var(--sunken)}}
.rpx-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.rpx-top{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:15;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 0;background:var(--bg)}
.rpx-h{margin:0 auto 0 0;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.rpx-per{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rpx-pp{position:relative}
.rpx-pbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;transition:border-color 150ms ease,transform 140ms cubic-bezier(.23,1,.32,1)}
.rpx-pbtn:active{transform:scale(.98)}
.rpx-pbtn svg{color:var(--muted)}.rpx-pbtn b{font-weight:600}.rpx-pbtn .num{color:var(--muted);font-family:var(--sans)}
.rpx-pbtn .ch{transition:transform 150ms cubic-bezier(.23,1,.32,1)}
.rpx-pbtn[aria-expanded="true"] .ch{transform:rotate(180deg)}
@media (hover:hover) and (pointer:fine){.rpx-pbtn:hover{border-color:var(--muted)}}
.rpx-cmp{font-size:13px;color:var(--muted)}
.rpx-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:300px;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.18);
  opacity:0;visibility:hidden;transform:translateY(-4px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity 120ms cubic-bezier(.23,1,.32,1),transform 120ms cubic-bezier(.23,1,.32,1),visibility 0s linear 120ms}
.rpx-pop.open{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity 160ms cubic-bezier(.23,1,.32,1),transform 160ms cubic-bezier(.23,1,.32,1),visibility 0s}
.rpx-pl{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rpx-pl button{height:38px;border:0;border-radius:8px;background:transparent;color:var(--fg);font:inherit;font-size:14px;text-align:left;padding:0 10px}
.rpx-pl button[aria-pressed="true"]{background:var(--lime-soft);color:var(--lime-text);font-weight:600}
@media (hover:hover) and (pointer:fine){.rpx-pl button:not([aria-pressed="true"]):hover{background:var(--sunken)}}
.rpx-rg{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding:10px 4px 4px;border-top:1px solid var(--line)}
.rpx-rg .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.rpx-rgi{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.rpx-rgi .inp{height:38px;padding:0 8px;font-size:14px}
/* kpis con ficha */
.rp-k.ix-pk,.rp-mini .ix-pk,.kpis .ix-pk{cursor:default}
.rp-mini>div{position:relative}
.wk>div{position:relative}
.wk .ix-peek.up,.rp-b .ix-peek.up{top:auto;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px) scale(.98);transform-origin:bottom center;min-width:220px}
.rp-b .ix-peek.up.rt{left:auto;right:0;transform:translateY(4px) scale(.98);transform-origin:bottom right}
@media (hover:hover) and (pointer:fine){.wk .ix-pk:hover>.ix-peek.up,.rp-b.ix-pk:hover>.ix-peek.up{transform:translate(-50%,0)}.rp-b.ix-pk:hover>.ix-peek.up.rt{transform:none}}
.rp-b.ix-pk{position:relative}
.rp-bars{overflow:visible}
@media (hover:hover) and (pointer:fine){.rp-b.ix-pk:hover{filter:brightness(.9)}}
.cats>div{position:relative}
.rpx-click{cursor:pointer;border-radius:8px}
@media (hover:hover) and (pointer:fine){.rpx-click:hover{background:var(--sunken)}}
/* margen por categoría */
.rpx-mg{display:flex;flex-direction:column;gap:8px}
.rpx-mg>div{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 56px;align-items:center;gap:10px;font-size:14px;position:relative;padding:2px 4px;border-radius:6px}
.rpx-mg .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpx-mb{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.rpx-mb i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.rpx-mb i.low{background:var(--warn)}.rpx-mb i.neg{background:var(--bad);opacity:.6}
.rpx-mg b{text-align:right}
@media (hover:hover) and (pointer:fine){.rpx-mg>div:hover{background:var(--sunken)}}
.rpx-alert{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
/* clases A, B, C */
.rpx-abcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rpx-abc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;text-align:left;transition:border-color 150ms ease,transform 140ms cubic-bezier(.23,1,.32,1)}
.rpx-abc:active{transform:scale(.98)}
.rpx-abc.on{border-color:var(--lime-text);box-shadow:0 0 0 1px var(--lime-text) inset}
.rpx-abc .t{display:flex;flex-direction:column;min-width:0}.rpx-abc .t small{font-size:12.5px;color:var(--muted)}
.rpx-cl{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;font-family:var(--display);font-weight:800;font-size:16px;flex:none}
.rpx-cl.sm{width:20px;height:18px;border-radius:5px;font-size:11px;vertical-align:1px}
.rpx-cl.cA{background:var(--lime);color:var(--lime-ink)}.rpx-cl.cB{background:var(--ok-soft);color:var(--ok)}.rpx-cl.cC{background:var(--sunken);color:var(--muted)}
@media (hover:hover) and (pointer:fine){.rpx-abc:hover{border-color:var(--muted)}}
@media (max-width:760px){.rpx-abcs{grid-template-columns:1fr}}
/* plegables y "ver más" */
.rpx-det{overflow:hidden}
.rpx-det>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer}
.rpx-det>summary::-webkit-details-marker{display:none}
.rpx-det>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.rpx-det[open]>summary::after{transform:rotate(-135deg)}
.rpx-det>summary span{display:flex;flex-direction:column}.rpx-det>summary small{font-size:13px;color:var(--muted)}
.rpx-det .table-wrap{border-top:1px solid var(--line)}
.rpx-more{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:12px 16px!important;border-top:1px solid var(--line)}
/* ficha flotante de tablas */
.rpx-tip{position:fixed;z-index:60;min-width:240px;max-width:min(340px,calc(100vw - 24px));padding:12px 14px;border-radius:12px;background:var(--brand);color:var(--brand-fg);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 34px rgba(18,20,16,.28);font-size:13.5px;line-height:1.35;pointer-events:none;opacity:0;transform:translateY(-3px) scale(.98);transition:opacity 120ms cubic-bezier(.23,1,.32,1),transform 120ms cubic-bezier(.23,1,.32,1)}
.rpx-tip.on{opacity:1;transform:none}
.rpx-tip .ttl{font-size:12.5px;font-weight:700;margin-bottom:6px}
.rpx-tip .pn{margin-top:6px;font-size:12.5px;color:var(--brand-muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rpx-tip{background:#46494D}}
:root[data-theme="dark"] .rpx-tip{background:#46494D}
@media (max-width:1000px){.rpx{grid-template-columns:minmax(0,1fr)}.rpx-nav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:4px}.rpx-nav button{width:auto;flex:none;grid-template-columns:18px auto auto}.rpx-nav .t small{display:none}.rpx-top{position:static}}
@media (max-width:760px){.rpx-pop{right:auto;left:0}.rpx-cmp{width:100%}}
@media (prefers-reduced-motion:reduce){.rpx-pop,.rpx-pop.open,.rpx-tip,.rpx-tip.on{transform:none!important}}
.wk .ix-peek.up.rt{left:auto;right:0;transform:translateY(4px) scale(.98);transform-origin:bottom right}
@media (hover:hover) and (pointer:fine){.wk .ix-pk:hover>.ix-peek.up.rt{transform:none}}

/* ===== Capa global v36: modo noche en grafito medio (antes casi negro) ===== */

  --bg:#2D2F32;--surface:#373A3E;--sunken:#404448;--line:#4A4E53;--line-strong:#5D6268;
  --fg:#EEF0EC;--muted:#B7BCB4;--brand:#232527;--brand-2:#1D1F21;--brand-fg:#EEF0EC;--brand-muted:#A9AFA6;

:root[data-theme="dark"]{
  --bg:#2D2F32;--surface:#373A3E;--sunken:#404448;--line:#4A4E53;--line-strong:#5D6268;
  --fg:#EEF0EC;--muted:#B7BCB4;--brand:#232527;--brand-2:#1D1F21;--brand-fg:#EEF0EC;--brand-muted:#A9AFA6;

var $=function(id){return document.getElementById(id)};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nf(n,d){return Number(n).toLocaleString('es-VE',{minimumFractionDigits:d,maximumFractionDigits:d})}
function usd(n,d){if(n==null||isNaN(n))return '—';if(d==null)d=Math.abs(n)<1&&n!==0?3:2;return '$ '+nf(n,d)}
function bs(n){if(n==null||isNaN(n))return '—';return 'Bs '+nf(n,2)}
function r2(n){return Math.round((Number(n)+Number.EPSILON)*100)/100}
function pct(x){return nf(x*100,Math.abs(x*100%1)<1e-9?0:2)+' %'}
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function fLong(t){var s=new Date(t).toLocaleDateString('es-VE',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1)}
function fTime(t){return new Date(t).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'})}
function fDT(t){return fDate(t)+' '+fTime(t)}
function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/\s/g,'').replace(/^\$|^bs/i,'');if(!s)return NaN;
  if(s.indexOf(',')>-1&&s.indexOf('.')>-1){s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}else{s=s.replace(',','.')}

/* ================= fórmulas del Excel ================= */
// G costo lista · H = G − G×d1 (pago al proveedor en Bs) · I = H − H×d2 (pago en divisas) · J = H + H×margen · F = C − E
/* ================= ALMACENES ================= */
/* El primero es el principal (la tienda, venta al detal): tiene la existencia total menos lo que está en los otros.
   Los otros (ej. depósito de atrás) llevan su cuenta con traspasos, compras que entran ahí y ventas que salen de ahí. */
var ALM_DEF=[{id:'tienda',nombre:'Tienda (adelante)'},{id:'deposito',nombre:'Depósito (atrás)'}];
var _almC=null;
function almList(){return S.almacenes||ALM_DEF}
function almPrin(){return almList()[0].id}
function almNom(id){var a=almList().filter(function(x){return x.id===id})[0];return a?a.nombre:(id||'—')}
function almCorto(id){return String(almNom(id)).split(/[\s(]/)[0]}
function almMulti(){return almList().length>1}
function almIdx(){if(_almC)return _almC;var Pr=almPrin(),I={};var add=function(a,id,q){if(!a||a===Pr||!id)return;var m=I[a]||(I[a]={});m[id]=(m[id]||0)+q};
  Object.keys(S.traspasos||{}).forEach(function(k){var t=S.traspasos[k];if(!t||t.anulado)return;(t.items||[]).forEach(function(it){add(t.a,it.id,+it.cant||0);add(t.de,it.id,-(+it.cant||0))})});
  Object.keys(S.ventas||{}).forEach(function(k){var v=S.ventas[k];if(!v||v.anulada)return;(v.items||[]).forEach(function(it){if(it.alm)add(it.alm,it.id,-(+it.cant||0))})});
  Object.keys(S.compras||{}).forEach(function(k){var c=S.compras[k];if(!c||c.anulada||!c.alm)return;(c.items||[]).forEach(function(it){add(c.alm,it.id,+it.cant||0)})});
  _almC=I;return I}
function stockAlm(p,a){var I=almIdx();if(a===almPrin()){var o=0;for(var x in I)o+=(I[x][p.id]||0);return calc(p).F-o}return (I[a]&&I[a][p.id])||0}
function almDesgHtml(p){if(!almMulti())return '';return almList().map(function(a){var q=stockAlm(p,a.id);return '<span class="almq'+(q<=0?' cero':'')+'">'+esc(almCorto(a.id))+' <b class="num">'+nf(q,0)+'</b></span>'}).join('')}
function calc(p){
  var d1=p.d1!=null?p.d1:S.cfg.d1, d2=p.d2!=null?p.d2:S.cfg.d2;
  var G=p.costo, H=G==null?null:G-(G*d1), I=H==null?null:H-(H*d2);
  var baseV=p.base==='I'?I:H;
  var J=p.fijo!=null?p.fijo:(baseV==null?null:baseV+(baseV*S.cfg.margen));
  var E=S.vendidos[p.id]||0, C=p.exist||0, min=p.minimo!=null?p.minimo:S.cfg.minimo;
  var D=J==null?null:J*(1-d2);
  return {G:G,H:H,I:I,J:J,D:D,C:C,E:E,F:C-E,min:min,d1:d1,d2:d2,bs:(J!=null&&S.cfg.tasa)?J*S.cfg.tasa:null};
}

function rebuildProds(){
  var all=[];Object.keys(S.chunks).sort().forEach(function(cid){var it=S.chunks[cid]||{};Object.keys(it).forEach(function(pid){var p=it[pid];if(p&&!p.borrado)all.push(Object.assign({id:pid,chunk:cid},p))})});
  all.sort(function(a,b){return a.id<b.id?-1:a.id>b.id?1:0});
  S.prods=all;S.byId={};S.byCode={};var cs={},es={};all.forEach(function(p){S.byId[p.id]=p;S.byCode[p.codigo]=p;if(p.cat)cs[p.cat]=1;if(p.ubic)es[p.ubic]=1});
  S.ests=Object.keys(es).sort(function(a,b){return a.localeCompare(b,'es',{numeric:true})});
  S.cats=Object.keys(cs).sort(function(a,b){return a.localeCompare(b,'es')});
}
function ventasArr(){return Object.keys(S.ventas).map(function(k){return S.ventas[k]})}
function rebuildVendidos(){
  var v={};ventasArr().forEach(function(s){if(s.anulada)return;(s.items||[]).forEach(function(it){v[it.id]=(v[it.id]||0)+(Number(it.cant)||0)})});

}

function ventasDia(k){return ventasArr().filter(function(v){return (v.dia||dayKey(v.t))===k}).sort(function(a,b){return b.t-a.t})}
function resumen(list){
  var o={n:0,usd:0,bs:0,gan:0,items:0};
  list.forEach(function(v){if(v.anulada)return;o.n++;o.usd+=v.total||0;o.bs+=v.totalBs||0;(v.items||[]).forEach(function(it){o.items+=it.cant;if(it.costo!=null)o.gan+=(it.total||0)-it.costo*it.cant})});
  return o;
}
function cajaEsperado(k){
  var c=S.cajas[k]||{};var ap=c.apertura||{};var e={efectivo_usd:num(ap.usd,0),efectivo_bs:num(ap.bs,0)},lab={};
  ventasDia(k).forEach(function(v){if(v.anulada)return;(v.pagos||[]).forEach(function(p){if(p.metodo==='credito')return;var key=pagoKey(p);e[key]=(e[key]||0)+p.monto;lab[key]={label:pagoLabel(p),mon:p.mon}});
    if(v.vuelto){if(v.vueltoMon==='BS')e.efectivo_bs-=r2(v.vuelto*v.tasa);else e.efectivo_usd-=v.vuelto}});
  movsDia(k).forEach(function(m){var key=m.p.key;e[key]=(e[key]||0)+m.s*m.p.monto;lab[key]={label:m.p.label,mon:m.p.mon}});
  Object.keys(e).forEach(function(k2){e[k2]=r2(e[k2])});return {e:e,lab:lab};
}
function cajaFilas(k){
  var c=S.cajas[k]||{};var ci=c.cierre;
  if(ci&&ci.esperado){var L=ci.labels||{};return Object.keys(ci.esperado).map(function(key){var m=L[key]||metodo(key);return {key:key,label:m.label,mon:m.mon,esp:ci.esperado[key]}})}
  var x=cajaEsperado(k);var rows=[{key:'efectivo_usd',label:'Efectivo $',mon:'USD'},{key:'efectivo_bs',label:'Efectivo Bs',mon:'BS'}];
  var cs=cuentasAct();if(cs.length)cs.forEach(function(cu){rows.push({key:'c_'+cu.id,label:cu.nombre,mon:ctaMon(cu)})});
  else METODOS.forEach(function(m){if(!m.cash)rows.push({key:m.id,label:m.label,mon:m.mon})});
  Object.keys(x.e).forEach(function(key){if(!rows.some(function(r){return r.key===key})){var l=x.lab[key]||metodo(key);rows.push({key:key,label:l.label,mon:l.mon})}});
  rows.forEach(function(r){r.esp=x.e[r.key]||0});return rows;
}
function cajaPendiente(){
  var today=dayKey(Date.now());var dias={};ventasArr().forEach(function(v){if(!v.anulada){var k=v.dia||dayKey(v.t);if(k<today)dias[k]=1}});
  var ks=Object.keys(dias).sort().reverse();if(!ks.length)return null;var k=ks[0];var c=S.cajas[k];
  return (c&&c.cierre)?null:k;
}
function stockBajo(){var ag=[],bj=[];S.prods.forEach(function(p){if(p.costo==null&&p.fijo==null)return;var c=calc(p);if(c.F<=0)ag.push(p);else if(c.F<=c.min)bj.push(p)});return {ag:ag,bj:bj}}

function cliStats(){

function buildHist(){

  Object.keys(S.hist).forEach(function(mes){if(!/^\d{4}-\d{2}$/.test(mes))return;var doc=S.hist[mes];var y=+mes.slice(0,4),mo=+mes.slice(5,7);
    (doc.lineas||[]).forEach(function(l){var t=new Date(y,mo-1,l[0]||1,12).getTime();var dk=dayKey(t);
      var x={t:t,dia:dk,code:l[1],cant:l[2],usd:l[3],bs:l[4],tasa:l[5],pm:l[6],efbs:l[7],efusd:l[8],punto:l[9],nombre:l[10]>=0?(doc.nombres||[])[l[10]]:'',desc:(doc.descs||{})[l[1]]};
      H.push(x);(bd[dk]||(bd[dk]=[])).push(x);var c=bc[l[1]]||(bc[l[1]]={q:0,q90:0,usd:0,last:0});c.q+=x.cant;c.usd+=x.usd;if(t>=t90)c.q90+=x.cant;if(t>c.last)c.last=t})});

function matches(qs,max){
  var q=norm(qs).trim();if(!q)return [];
  var terms=q.split(/\s+/);var exact=[],rest=[];
  for(var i=0;i<S.prods.length;i++){var p=S.prods[i];var code=norm(p.codigo),hay=code+' '+norm(p.desc)+' '+norm(p.cat)+' '+norm(p.ubic);
    if(code===q){exact.push(p);continue}
    if(terms.every(function(t){return hay.indexOf(t)>-1}))rest.push(p);
    if(rest.length>max+20)break}
  return exact.concat(rest).slice(0,max);
}

function submitProd(pid){
  var old=pid?S.byId[pid]:null;var d=readProdForm(old||{});var err=$('fErr');
  var bad=function(m){err.textContent=m;err.hidden=false};
  if(!d.codigo)return bad('Escribe el código del producto.');if(!d.desc)return bad('Escribe la descripción.');

  var dup=S.prods.filter(function(x){return x.codigo.toLowerCase()===d.codigo.toLowerCase()&&x.id!==pid})[0];
  if(dup)return bad('Ya existe otro producto con el código '+dup.codigo+' ('+dup.desc+').');
  var id=pid||newId('p');var before=old?calc(old):null;

    if(String(old.costo)!==String(d.costo)){
      var subio=old.costo!=null&&d.costo!=null&&d.costo>old.costo;
      logCambio({tipo:'costo',pid:id,codigo:d.codigo,desc:d.desc,campo:'Costo',antes:old.costo,despues:d.costo,precioAntes:before.J,precioDespues:after.J,subio:subio,fijo:d.fijo!=null,revisado:false});
      if(subio&&d.fijo!=null)msgs.push('Subió el costo, pero este producto tiene precio fijo: revisa su precio.');

    }
    toast(msgs[0]||'Cambios guardados');
  }).catch(fail);
}

function monthKey(t){return dayKey(t).slice(0,7)}
function mesLabel(k){var M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return M[+k.slice(5,7)-1]+' '+k.slice(0,4)}

// pago saliente o entrante: {key,label,mon,monto,usd,tasa}
function mkPago(key,montoUsd,montoIn){var o=optByKey(key);if(!o)return null;var tasa=S.cfg.tasa||0;
  var monto=montoIn!=null?montoIn:(o.mon==='USD'?montoUsd:r2(montoUsd*tasa));var usdv=o.mon==='USD'?monto:(tasa?monto/tasa:0);
  return {key:o.key,label:o.label,mon:o.mon,monto:r2(monto),usd:r2(usdv),tasa:tasa}}
function fPago(p){return p?(p.mon==='USD'?usd(p.monto,2):bs(p.monto)):'—'}
function movsDia(k){ // movimientos de dinero del día que afectan la caja (signo + entra, − sale)
  var m=[];
  arr(S.gastos).forEach(function(g){if(g.dia===k&&g.pago)m.push({p:g.pago,s:-1})});
  arr(S.compras).forEach(function(c){if(c.dia===k&&c.pago&&!c.anulada)m.push({p:c.pago,s:-1})});
  arr(S.abonos).forEach(function(a){if(a.dia===k&&a.pago)m.push({p:a.pago,s:a.tipo==='cxc'?1:-1})});
  arr(S.movcta).forEach(function(x){if(x.anulado||x.dia!==k)return;m.push({p:{key:x.a,label:x.aNombre,mon:x.aMon,monto:x.montoA},s:-1});m.push({p:{key:x.key,label:x.nombre,mon:x.mon,monto:x.monto},s:1})});
  return m;
}

function agruparCartera(rows){

    var base=String(r.quien||'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();x.nombres[base]=(x.nombres[base]||0)+1;x.rows.push(r);x.total+=r.total;x.pagado+=r.pagado;x.saldo+=Math.max(0,r.saldo);
    if(r.saldo>0.009)x.t0=Math.min(x.t0,r.t);if(r.tel&&!x.tel)x.tel=r.tel;if(r.doc&&!x.doc)x.doc=r.doc});
  return Object.keys(g).map(function(k){var x=g[k];x.nombre=Object.keys(x.nombres).sort(function(a,b){return x.nombres[b]-x.nombres[a]})[0]||'Sin nombre';x.rows.sort(function(a,b){return a.t-b.t});x.dias=x.t0===Infinity?0:Math.floor((Date.now()-x.t0)/864e5);x.pend=x.rows.filter(function(r){return r.saldo>0.009}).length;return x})

  if(S.rpxBound)return;S.rpxBound=true;
  document.addEventListener('click',function(e){
    var t=e.target.closest&&e.target.closest('[data-rpxpop],[data-rpxrango],[data-rpxins],[data-rpxcl],[data-rpxvis],[data-rpxvisc],[data-rpxvisi],[data-rpxa],[data-rpxmv],[data-rpxhide],[data-rpxshow]');
    var pop=document.querySelector('.rpx-pop.open');
    if(!t){if(pop&&!e.target.closest('.rpx-pp')){S.rpxPop=false;pop.classList.remove('open');var b0=document.querySelector('[data-rpxpop]');if(b0)b0.setAttribute('aria-expanded','false')}
      if(e.target.closest&&e.target.closest('.rpx-pop [data-rpper]'))S.rpxPop=false;return}
    var d=t.dataset;
    if(d.rpxpop!=null){S.rpxPop=!S.rpxPop;var p=document.querySelector('.rpx-pop');if(p)p.classList.toggle('open',S.rpxPop);t.setAttribute('aria-expanded',String(S.rpxPop));return}
    if(d.rpxrango!=null){var a=$('rpD'),b=$('rpH');if(a&&b&&a.value&&b.value){S.rp.desde=a.value;S.rp.hasta=b.value;S.rp.per='rango';S.rpxPop=false;updReportes()}return}
    if(d.rpxins!=null){S.rpxIns=!S.rpxIns;updReportes();return}
    if(d.rpxcl!=null){S.rpxCl=S.rpxCl===d.rpxcl?'':d.rpxcl;S.rpxVis=25;updReportes();return}
    if(d.rpxvis){S.rpxVis=+d.rpxvis;updReportes();return}
    if(d.rpxvisc){S.rpxVisC=+d.rpxvisc;updReportes();return}
    if(d.rpxvisi){S.rpxVisI=+d.rpxvisi;updReportes();return}
    var DEF=['saber','costos','tiempo','estrella','dias','cats','margen'];var o=rpxLayout(DEF);
    if(d.rpxa==='edit'){S.rpxEdit=true;updReportes();return}
    if(d.rpxa==='done'){S.rpxEdit=false;updReportes();toast('Listo. Los reportes quedaron así en este navegador.');return}
    if(d.rpxa==='reset'){rpxSave({order:DEF.slice(),hidden:[]});updReportes();return}
    if(d.rpxhide){o.hidden.push(d.rpxhide);rpxSave(o);updReportes();return}
    if(d.rpxshow){o.hidden=o.hidden.filter(function(k){return k!==d.rpxshow});rpxSave(o);updReportes();return}
    if(d.rpxmv){var pr=d.rpxmv.split(':'),k=pr[0],dir=+pr[1];var vis=o.order.filter(function(x){return o.hidden.indexOf(x)<0&&document.querySelector('[data-rpxk="'+x+'"]')});var i=vis.indexOf(k),j=i+dir;if(i<0||j<0||j>=vis.length)return;var ia=o.order.indexOf(vis[i]),ib=o.order.indexOf(vis[j]);var tmp=o.order[ia];o.order[ia]=o.order[ib];o.order[ib]=tmp;rpxSave(o);updReportes();var nb=document.querySelector('[data-rpxmv="'+k+':'+dir+'"]');if(nb&&!nb.disabled)nb.focus();return}

  document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.rpx-pop [data-rpper]'))S.rpxPop=false},true);
